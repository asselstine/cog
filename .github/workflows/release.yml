name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (for example, v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a v-prefixed semantic version (for example, v0.1.0)" >&2
            exit 1
          fi
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "release tag $RELEASE_TAG does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: cog
            archive: cog-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: cog
            archive: cog-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: cog
            archive: cog-x86_64-apple-darwin.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: cog
            archive: cog-aarch64-apple-darwin.tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: cog.exe
            archive: cog-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build embedded frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build cog
        shell: bash
        env:
          COG_FRONTEND_PREBUILT: "1"
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test
        shell: bash
        run: "target/${{ matrix.target }}/release/${{ matrix.binary }} --version"
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/cog
          tar -C staging -czf "${{ matrix.archive }}" cog
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/cog.exe
          Compress-Archive -Path staging/cog.exe -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum cog-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  verify-installers:
    name: Verify installer (${{ matrix.os }})
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install and execute Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          COG_VERSION: ${{ needs.prepare.outputs.tag }}
          COG_INSTALL_DIR: ${{ runner.temp }}/cog bin
        run: |
          curl -fsSL "https://raw.githubusercontent.com/asselstine/cog/${{ needs.prepare.outputs.tag }}/install.sh" | sh
          "$COG_INSTALL_DIR/cog" --version
      - name: Install and execute Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COG_VERSION: ${{ needs.prepare.outputs.tag }}
          COG_INSTALL_DIR: ${{ runner.temp }}\cog bin
        run: |
          irm "https://raw.githubusercontent.com/asselstine/cog/${{ needs.prepare.outputs.tag }}/install.ps1" | iex
          & (Join-Path $env:COG_INSTALL_DIR 'cog.exe') --version
