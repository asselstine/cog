name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: Install pinned Litestream reference
        run: |
          curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.5.16/litestream-0.5.16-linux-x86_64.tar.gz | tar -xz -C /tmp
          echo "LITESTREAM_BIN=/tmp/litestream" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo audit --deny warnings
      - run: cargo deny check licenses bans sources
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --all-targets --no-report
      - run: COG_COVERAGE=1 tests/infrastructure/test-s3.sh
      - run: tests/infrastructure/test-installers.sh
      - name: Exercise README first run
        run: cargo test --test onboarding
      # Unit-test source used to live under src/ and was included in the old
      # 95.25% baseline. Keep the metric comparable after moving it to tests/.
      - run: cargo llvm-cov report --no-default-ignore-filename-regex --fail-under-lines 95
      - name: Keep tests out of production Rust sources
        run: |
          if rg -n '#\[cfg\(test\)\]|#\[(tokio::)?test' src; then
            echo 'Rust tests must live under tests/' >&2
            exit 1
          fi
      - run: docker build -t cog:ci .
      - run: docker run --rm cog:ci --version
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ssh-interop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify key lease, parser, and stock OpenSSH interoperability
        run: "cargo test --test git suite::ssh::"
